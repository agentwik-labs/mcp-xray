name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      # --ignore-scripts: no dependency install scripts run (rea-agents' optional frida has one)
      - run: npm ci --ignore-scripts
      - run: npm test
